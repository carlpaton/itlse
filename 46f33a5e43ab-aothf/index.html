<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
    <title>Sign in to Microsoft Azure</title>
    <style>
      :root {
        --page-bg: #eceef2;
        --card-bg: #ffffff;
        --ink: #1b1b1b;
        --muted: #616161;
        --line: #dddddd;
        --accent: #0f6cbd;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--page-bg);
        color: var(--ink);
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      .app-shell {
        min-height: 100vh;
        display: grid;
        place-items: center;
        position: relative;
        overflow: hidden;
      }

      .bg-shape {
        position: absolute;
        border-radius: 999px;
        opacity: 0.7;
        pointer-events: none;
      }

      .bg-shape.one {
        width: 800px;
        height: 800px;
        left: -220px;
        top: -180px;
        background: radial-gradient(circle at 30% 30%, #f0f2f7 0%, #dfe3ec 78%, transparent 100%);
      }

      .bg-shape.two {
        width: 860px;
        height: 860px;
        right: -260px;
        bottom: -280px;
        background: radial-gradient(circle at 60% 40%, #f7f1f4 0%, #e8e9f0 80%, transparent 100%);
      }

      .card {
        width: min(92vw, 350px);
        padding: 24px 28px;
        background: var(--card-bg);
        border: 1px solid var(--line);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
        position: relative;
        z-index: 1;
      }

      .entry-stack {
        position: relative;
        z-index: 1;
        width: min(92vw, 350px);
        display: grid;
        gap: 14px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 22px;
        font-weight: 500;
        margin-bottom: 12px;
      }

      .ms-logo {
        width: 16px;
        height: 16px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: 1fr 1fr;
        gap: 2px;
      }

      .ms-logo span:nth-child(1) {
        background: #f25022;
      }

      .ms-logo span:nth-child(2) {
        background: #7fba00;
      }

      .ms-logo span:nth-child(3) {
        background: #00a4ef;
      }

      .ms-logo span:nth-child(4) {
        background: #ffb900;
      }

      .heading {
        font-size: 29px;
        line-height: 1.3;
        margin: 8px 0 2px;
        font-weight: 600;
      }

      .subheading {
        margin: 0;
        font-size: 12px;
        color: var(--muted);
      }

      .accounts {
        list-style: none;
        margin: 16px 0 0;
        padding: 0;
      }

      .account-link {
        width: 100%;
        border: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        text-align: left;
        background: #ffffff;
        padding: 10px 8px;
        border-radius: 4px;
        cursor: pointer;
        transition: background 140ms ease;
      }

      .account-link:hover {
        background: #f5f5f5;
      }

      .account-main {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }

      .avatar {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        border: 1px solid #c9c9c9;
        background: #efefef;
        color: #646464;
        display: grid;
        place-items: center;
        font-size: 17px;
        flex: 0 0 32px;
      }

      .account-text {
        min-width: 0;
      }

      .account-name {
        margin: 0;
        font-size: 13px;
        color: #262626;
      }

      .account-email {
        margin: 0;
        font-size: 11px;
        color: #606060;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .kebab {
        color: #606060;
        font-size: 18px;
        line-height: 1;
      }

      .flow-card-title {
        margin: 0;
        font-size: 21px;
        font-weight: 600;
      }

      .flow-card-copy {
        margin: 8px 0 0;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.45;
      }

      .qr-cta {
        margin-top: 16px;
        display: block;
        border: 1px solid #cfd7e3;
        border-radius: 8px;
        padding: 14px;
        transition: border-color 140ms ease, box-shadow 140ms ease, transform 140ms ease;
      }

      .qr-cta:hover {
        border-color: #9fb5d4;
        box-shadow: 0 8px 16px rgba(15, 108, 189, 0.12);
        transform: translateY(-1px);
      }

      .qr-wrap {
        display: flex;
        align-items: center;
        gap: 14px;
      }

      .qr-visual {
        width: 66px;
        height: 66px;
        background: #fff;
        border: 1px solid #cfd7e3;
        border-radius: 4px;
        padding: 6px;
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        grid-template-rows: repeat(7, 1fr);
        gap: 2px;
        flex: 0 0 66px;
      }

      .qr-visual span {
        background: transparent;
      }

      .qr-visual span.fill {
        background: #151515;
      }

      .qr-label {
        font-size: 14px;
        color: #111;
        font-weight: 600;
      }

      .qr-label small {
        display: block;
        margin-top: 3px;
        font-size: 12px;
        font-weight: 400;
        color: #606060;
      }

      .account-link:focus-visible,
      .qr-cta:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      @media (max-width: 560px) {
        .card {
          padding: 18px;
        }

        .heading {
          font-size: 26px;
        }
      }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <div class="bg-shape one" aria-hidden="true"></div>
      <div class="bg-shape two" aria-hidden="true"></div>

      <div class="entry-stack">
        <main class="card" role="main" aria-label="Account picker">
          <div class="brand">
            <div class="ms-logo" aria-hidden="true">
              <span></span><span></span><span></span><span></span>
            </div>
            <span>Microsoft</span>
          </div>

          <h1 class="heading">Pick an account</h1>
          <p class="subheading">to continue with your microsoft account</p>

          <ul class="accounts">
            <li>
              <a class="account-link" href="./regional-manager/dashboard.html" aria-label="Sign in as regionalmanager@testing-demo.com">
                <div class="account-main">
                  <div class="avatar" aria-hidden="true">U</div>
                  <div class="account-text">
                    <p class="account-name">Test User</p>
                    <p class="account-email">regionalmanager@testing-demo.com</p>
                  </div>
                </div>
                <div class="kebab" aria-hidden="true">⋮</div>
              </a>
            </li>
          </ul>
        </main>

        <section class="card" aria-label="Alternate flow entry">
          <h2 class="flow-card-title">Log a Fault via QR</h2>
          <p class="flow-card-copy">This is another flow for fast site fault logging.</p>

          <a class="qr-cta" href="./regional-manager/qr-fault01.html" aria-label="Open QR fault logging flow">
            <div class="qr-wrap">
              <div class="qr-visual" aria-hidden="true">
                <span class="fill"></span><span class="fill"></span><span></span><span class="fill"></span><span></span><span class="fill"></span><span class="fill"></span>
                <span class="fill"></span><span></span><span class="fill"></span><span></span><span class="fill"></span><span></span><span class="fill"></span>
                <span></span><span class="fill"></span><span class="fill"></span><span></span><span></span><span class="fill"></span><span></span>
                <span class="fill"></span><span></span><span></span><span class="fill"></span><span class="fill"></span><span></span><span class="fill"></span>
                <span></span><span class="fill"></span><span></span><span class="fill"></span><span></span><span class="fill"></span><span></span>
                <span class="fill"></span><span></span><span class="fill"></span><span></span><span class="fill"></span><span></span><span class="fill"></span>
                <span class="fill"></span><span class="fill"></span><span></span><span class="fill"></span><span></span><span class="fill"></span><span class="fill"></span>
              </div>
              <div class="qr-label">
                Open QR Fault Flow
                <small>Tap to continue to security code entry</small>
              </div>
            </div>
          </a>
        </section>
      </div>
    </div>
  </body>
</html>
