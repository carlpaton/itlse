<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
  <title>AoTech - Create Expense</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Sora:wght@600;700&display=swap");

    :root {
      --font-display: "Sora", "Segoe UI", sans-serif;
      --font-body: "Public Sans", "Segoe UI", sans-serif;

      --color-nav-top: #2a3f56;
      --color-nav-main: #334d69;
      --color-nav-active: #3f5f80;
      --color-nav-hover: #3a5878;

      --color-page-bg: #f3f5f8;
      --color-surface: #ffffff;
      --color-border: #d7e0ea;
      --color-surface-muted: #eef3f8;

      --color-text-strong: #10233a;
      --color-text-body: #26394f;
      --color-text-muted: #5f7185;
      --color-text-on-dark: #f7fbff;

      --color-focus: #5b8cc2;
      --shadow-soft: 0 1px 2px rgba(10, 24, 40, 0.08), 0 6px 16px rgba(17, 36, 56, 0.04);

      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 20px;
      --space-6: 24px;
      --space-8: 32px;
      --radius-sm: 6px;
      --radius-md: 10px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: var(--font-body);
      color: var(--color-text-body);
      background: var(--color-page-bg);
    }

    .app-header {
      position: sticky;
      top: 0;
      z-index: 20;
      box-shadow: 0 1px 0 rgba(7, 18, 32, 0.15);
    }

    .top-bar {
      height: 56px;
      background: var(--color-nav-top);
      color: var(--color-text-on-dark);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 var(--space-6);
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: var(--space-3);
    }

    .brand {
      color: var(--color-text-on-dark);
      text-decoration: none;
      font-family: var(--font-display);
      font-size: 1.55rem;
      font-weight: 700;
      letter-spacing: 0.2px;
    }

    .icon-btn {
      border: 0;
      background: transparent;
      color: inherit;
      width: 36px;
      height: 36px;
      border-radius: 999px;
      display: inline-grid;
      place-items: center;
      cursor: pointer;
      position: relative;
      font-size: 1rem;
      line-height: 1;
    }

    .icon-btn:hover { background: rgba(255, 255, 255, 0.12); }

    .icon-btn:focus-visible,
    .nav-link:focus-visible,
    .form-input:focus-visible,
    .btn-primary:focus-visible,
    .btn-secondary:focus-visible,
    .filter-tab:focus-visible {
      outline: 2px solid var(--color-focus);
      outline-offset: 2px;
    }

    .has-dot::after {
      content: "";
      position: absolute;
      top: 7px;
      right: 7px;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #ff4d4d;
    }

    .main-nav {
      min-height: 44px;
      background: var(--color-nav-main);
      display: flex;
      align-items: center;
      gap: var(--space-2);
      padding: 0 var(--space-5);
      overflow-x: auto;
    }

    .nav-link {
      color: rgba(247, 251, 255, 0.95);
      text-decoration: none;
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      font-weight: 600;
      white-space: nowrap;
      transition: background 160ms ease;
    }

    .nav-link:hover { background: var(--color-nav-hover); }
    .nav-link.is-active { background: var(--color-nav-active); }

    .page-content {
      max-width: 1220px;
      margin: 0 auto;
      padding: var(--space-8) var(--space-6);
      animation: page-enter 320ms ease-out;
    }

    .page-toolbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: var(--space-4);
      margin-bottom: var(--space-6);
      flex-wrap: wrap;
    }

    .page-title {
      margin: 0;
      color: var(--color-text-strong);
      font-family: var(--font-display);
      font-size: clamp(1.7rem, 3vw, 2.15rem);
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .page-subtitle {
      margin: var(--space-2) 0 0;
      color: var(--color-text-muted);
      font-size: 1.02rem;
    }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid transparent;
      border-radius: var(--radius-sm);
      background: linear-gradient(135deg, #324e6b, #3a5a7b);
      color: #ffffff;
      min-height: 44px;
      padding: 0 var(--space-5);
      font-size: 0.96rem;
      font-weight: 700;
      font-family: var(--font-body);
      text-decoration: none;
      cursor: pointer;
      box-shadow: 0 6px 12px rgba(42, 63, 86, 0.18);
      transition: transform 140ms ease, box-shadow 140ms ease, filter 140ms ease;
      white-space: nowrap;
    }

    .btn-primary:hover {
      filter: brightness(0.95);
      transform: translateY(-1px);
      box-shadow: 0 10px 16px rgba(42, 63, 86, 0.2);
    }

    .btn-secondary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #b9c7d7;
      border-radius: var(--radius-sm);
      background: #ffffff;
      color: var(--color-text-body);
      min-height: 44px;
      padding: 0 var(--space-5);
      font-size: 0.95rem;
      font-weight: 600;
      font-family: var(--font-body);
      cursor: pointer;
      text-decoration: none;
      transition: background 140ms ease, border-color 140ms ease;
    }

    .btn-secondary:hover {
      background: #f2f6fb;
      border-color: #9fb1c6;
    }

    .filter-tabs {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      flex-wrap: wrap;
      margin-bottom: var(--space-5);
      border-bottom: 1px solid var(--color-border);
      padding-bottom: var(--space-3);
    }

    .filter-tab {
      padding: 6px 14px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      background: var(--color-surface);
      font-family: var(--font-body);
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--color-text-body);
      cursor: pointer;
      transition: background 160ms ease, border-color 160ms ease;
    }

    .filter-tab:hover { background: #e9eef5; }
    .filter-tab.active {
      background: var(--color-nav-main);
      color: var(--color-text-on-dark);
      border-color: var(--color-nav-main);
    }

    .form-card {
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      background: var(--color-surface);
      box-shadow: var(--shadow-soft);
      padding: var(--space-6);
    }

    .expense-form {
      max-width: 520px;
      margin: 0 auto;
      display: grid;
      gap: var(--space-4);
    }

    .form-field {
      display: grid;
      gap: var(--space-1);
    }

    .form-field label {
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--color-text-muted);
    }

    .form-input {
      width: 100%;
      height: 44px;
      padding: 0 var(--space-4);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      background: #ffffff;
      color: var(--color-text-body);
      font-family: var(--font-body);
      font-size: 0.95rem;
      transition: border-color 160ms ease, box-shadow 160ms ease;
    }

    .form-input:focus {
      border-color: var(--color-focus);
      box-shadow: 0 0 0 3px rgba(91, 140, 194, 0.18);
      outline: none;
    }

    .form-actions {
      margin-top: var(--space-2);
      display: flex;
      justify-content: center;
      gap: var(--space-3);
      flex-wrap: wrap;
    }

    @keyframes page-enter {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 768px) {
      .top-bar { padding: 0 var(--space-4); }
      .page-content { padding: var(--space-6) var(--space-4); }
      .form-actions { flex-direction: column-reverse; }
      .btn-primary,
      .btn-secondary { width: 100%; }
    }
  </style>
</head>
<body>
  <header class="app-header" role="banner">
    <div class="top-bar">
      <div class="brand-group">
        <button class="icon-btn" aria-label="Open menu">&#9776;</button>
        <a class="brand" href="dashboard.html">AoTech</a>
      </div>
      <div class="utility-icons" aria-label="Utility actions">
        <button class="icon-btn" aria-label="Search">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.35-4.35"></path>
          </svg>
        </button>
        <button class="icon-btn has-dot" aria-label="Notifications">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
          </svg>
        </button>
        <a class="icon-btn" href="./../index.html" aria-label="Profile">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
        </a>
      </div>
    </div>

    <nav class="main-nav" aria-label="Primary">
      <a href="users01.html" class="nav-link">Users</a>
      <a href="reports01.html" class="nav-link">Reports</a>
      <a href="expenses01.html" class="nav-link is-active" aria-current="page">Expenses</a>
      <a href="contractor01.html" class="nav-link">Contractor</a>
      <a href="calendar01.html" class="nav-link">Calendar</a>
    </nav>
  </header>

  <main class="page-content" id="page-content">
    <section class="page-toolbar" aria-label="Create expense heading">
      <div>
        <h1 class="page-title">Create Expense</h1>
        <p class="page-subtitle">Add item details, costs, and mark up for this job</p>
      </div>
      <a class="btn-secondary" href="job01.html">Create Job</a>
    </section>

    <section class="filter-tabs" role="tablist" aria-label="Expense filters">
      <button class="filter-tab active" role="tab" aria-selected="true" type="button">All jobs</button>
      <button class="filter-tab" role="tab" aria-selected="false" type="button">In progress</button>
      <button class="filter-tab" role="tab" aria-selected="false" type="button">Completed</button>
      <button class="filter-tab" role="tab" aria-selected="false" type="button">Invoiced</button>
    </section>

    <section class="form-card" aria-label="Create expense form">
      <form class="expense-form" method="post" novalidate>
        <div class="form-field">
          <label for="item-code">Item code</label>
          <input class="form-input" id="item-code" name="item_code" type="text" placeholder="Item code" required />
        </div>

        <div class="form-field">
          <label for="item-name">Item name</label>
          <input class="form-input" id="item-name" name="item_name" type="text" placeholder="Item name" required />
        </div>

        <div class="form-field">
          <label for="item-description">Item description</label>
          <input class="form-input" id="item-description" name="item_description" type="text" placeholder="Item Description" required />
        </div>

        <div class="form-field">
          <label for="item-markup">Mark up %</label>
          <input class="form-input" id="item-markup" name="item_markup" type="text" placeholder="MARK UP %" required />
        </div>

        <div class="form-field">
          <label for="item-cost">Item cost</label>
          <input class="form-input" id="item-cost" name="item_cost" type="text" placeholder="Item cost" required />
        </div>

        <div class="form-actions">
          <a class="btn-secondary" href="expenses01.html">Cancel</a>
          <a class="btn-primary" href="expenses01.html">Save</a>
        </div>
      </form>
    </section>
  </main>
</body>
</html>
