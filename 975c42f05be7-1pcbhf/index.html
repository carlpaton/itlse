<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
    <title>Sign in to Microsoft Azure</title>
    <style>
      :root {
        --page-bg: #eceef2;
        --card-bg: #ffffff;
        --ink: #1b1b1b;
        --muted: #616161;
        --line: #dddddd;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--page-bg);
        color: var(--ink);
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      .app-shell {
        min-height: 100vh;
        display: grid;
        place-items: center;
        position: relative;
        overflow: hidden;
      }

      .bg-shape {
        position: absolute;
        border-radius: 999px;
        opacity: 0.7;
        pointer-events: none;
      }

      .bg-shape.one {
        width: 800px;
        height: 800px;
        left: -220px;
        top: -180px;
        background: radial-gradient(circle at 30% 30%, #f0f2f7 0%, #dfe3ec 78%, transparent 100%);
      }

      .bg-shape.two {
        width: 860px;
        height: 860px;
        right: -260px;
        bottom: -280px;
        background: radial-gradient(circle at 60% 40%, #f7f1f4 0%, #e8e9f0 80%, transparent 100%);
      }

      .card {
        width: min(92vw, 350px);
        padding: 24px 28px;
        background: var(--card-bg);
        border: 1px solid var(--line);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
        position: relative;
        z-index: 1;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 22px;
        font-weight: 500;
        margin-bottom: 12px;
      }

      .ms-logo {
        width: 16px;
        height: 16px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: 1fr 1fr;
        gap: 2px;
      }

      .ms-logo span:nth-child(1) {
        background: #f25022;
      }

      .ms-logo span:nth-child(2) {
        background: #7fba00;
      }

      .ms-logo span:nth-child(3) {
        background: #00a4ef;
      }

      .ms-logo span:nth-child(4) {
        background: #ffb900;
      }

      .heading {
        font-size: 29px;
        line-height: 1.3;
        margin: 8px 0 2px;
        font-weight: 600;
      }

      .subheading {
        margin: 0;
        font-size: 12px;
        color: var(--muted);
      }

      .accounts {
        list-style: none;
        margin: 16px 0 0;
        padding: 0;
      }

      .account-link {
        width: 100%;
        border: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        text-align: left;
        background: #ffffff;
        padding: 10px 8px;
        border-radius: 4px;
        cursor: pointer;
        transition: background 140ms ease;
      }

      .account-link:hover {
        background: #f5f5f5;
      }

      .account-main {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }

      .avatar {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        border: 1px solid #c9c9c9;
        background: #efefef;
        color: #646464;
        display: grid;
        place-items: center;
        font-size: 17px;
        flex: 0 0 32px;
      }

      .account-text {
        min-width: 0;
      }

      .account-name {
        margin: 0;
        font-size: 13px;
        color: #262626;
      }

      .account-email {
        margin: 0;
        font-size: 11px;
        color: #606060;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .kebab {
        color: #606060;
        font-size: 18px;
        line-height: 1;
      }

      @media (max-width: 560px) {
        .card {
          padding: 18px;
        }

        .heading {
          font-size: 26px;
        }
      }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <div class="bg-shape one" aria-hidden="true"></div>
      <div class="bg-shape two" aria-hidden="true"></div>

      <main class="card" role="main" aria-label="Account picker">
        <div class="brand">
          <div class="ms-logo" aria-hidden="true">
            <span></span><span></span><span></span><span></span>
          </div>
          <span>Microsoft</span>
        </div>

        <h1 class="heading">Pick an account</h1>
        <p class="subheading">to continue with your microsoft account</p>

        <ul class="accounts" id="accountsList">
          <li>
            <a class="account-link" href="admin-area/admin.html" aria-label="Sign in as admin@testing.com">
              <div class="account-main">
                <div class="avatar" aria-hidden="true">U</div>
                <div class="account-text">
                  <p class="account-name">Admin User</p>
                  <p class="account-email">admin@testing.com</p>
                </div>
              </div>
              <div class="kebab" aria-hidden="true">⋮</div>
            </a>
          </li>
          <li>
            <a class="account-link" href="client-one/chatbot.html" aria-label="Sign in as client-one@testing.com">
              <div class="account-main">
                <div class="avatar" aria-hidden="true">U</div>
                <div class="account-text">
                  <p class="account-name">Client One</p>
                  <p class="account-email">client-one@testing.com</p>
                </div>
              </div>
              <div class="kebab" aria-hidden="true">⋮</div>
            </a>
          </li>
          <li>
            <a class="account-link" href="client-two/chatbot.html" aria-label="Sign in as client-two@testing.com">
              <div class="account-main">
                <div class="avatar" aria-hidden="true">U</div>
                <div class="account-text">
                  <p class="account-name">Client Two</p>
                  <p class="account-email">client-two@testing.com</p>
                </div>
              </div>
              <div class="kebab" aria-hidden="true">⋮</div>
            </a>
          </li>
        </ul>
      </main>
    </div>

    <script>
      const accountsList = document.getElementById("accountsList");
      const CLIENT_SCOPES_STORAGE_KEY = "testingDemoClientScopes";
      const DEFAULT_CLIENT_SCOPES = ["client-one", "client-two"];

      function readStoredClientScopes() {
        const raw = localStorage.getItem(CLIENT_SCOPES_STORAGE_KEY);
        if (!raw) {
          return [];
        }

        try {
          const parsed = JSON.parse(raw);
          if (!Array.isArray(parsed)) {
            return [];
          }

          return parsed
            .map((scope) => String(scope).trim().toLowerCase())
            .filter((scope) => scope.length > 0);
        } catch (error) {
          return [];
        }
      }

      function toClientLabel(scope) {
        return scope
          .split("-")
          .map((part) => (part ? part[0].toUpperCase() + part.slice(1) : ""))
          .join(" ");
      }

      function renderStoredClientAccounts() {
        const knownScopes = [];
        DEFAULT_CLIENT_SCOPES.concat(readStoredClientScopes()).forEach((scope) => {
          if (!knownScopes.includes(scope)) {
            knownScopes.push(scope);
          }
        });

        const existingScopes = new Set();
        accountsList.querySelectorAll("a.account-link").forEach((link) => {
          const href = link.getAttribute("href") || "";
          const match = href.match(/^([^/]+)\/chatbot\.html$/);
          if (match && match[1]) {
            existingScopes.add(match[1].toLowerCase());
          }
        });

        knownScopes.forEach((scope) => {
          if (existingScopes.has(scope)) {
            return;
          }

          const targetScope = DEFAULT_CLIENT_SCOPES.includes(scope) ? scope : "client-three";

          const item = document.createElement("li");
          const link = document.createElement("a");
          link.className = "account-link";
          link.href = `${targetScope}/chatbot.html`;
          link.setAttribute("aria-label", `Sign in as ${scope}@testing.com`);

          const main = document.createElement("div");
          main.className = "account-main";

          const avatar = document.createElement("div");
          avatar.className = "avatar";
          avatar.setAttribute("aria-hidden", "true");
          avatar.textContent = "U";

          const text = document.createElement("div");
          text.className = "account-text";

          const name = document.createElement("p");
          name.className = "account-name";
          name.textContent = toClientLabel(scope);

          const email = document.createElement("p");
          email.className = "account-email";
          email.textContent = `${scope}@testing.com`;

          text.appendChild(name);
          text.appendChild(email);
          main.appendChild(avatar);
          main.appendChild(text);

          const kebab = document.createElement("div");
          kebab.className = "kebab";
          kebab.setAttribute("aria-hidden", "true");
          kebab.textContent = "⋮";

          link.appendChild(main);
          link.appendChild(kebab);
          item.appendChild(link);
          accountsList.appendChild(item);
        });
      }

      renderStoredClientAccounts();
    </script>
  </body>
</html>
