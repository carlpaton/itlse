<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in to Microsoft Azure</title>
    <style>
      :root {
        --page-bg: #eceef2;
        --card-bg: #ffffff;
        --ink: #1b1b1b;
        --muted: #616161;
        --line: #dddddd;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--page-bg);
        color: var(--ink);
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      .app-shell {
        min-height: 100vh;
        display: grid;
        place-items: center;
        position: relative;
        overflow: hidden;
      }

      .bg-shape {
        position: absolute;
        border-radius: 999px;
        opacity: 0.7;
        pointer-events: none;
      }

      .bg-shape.one {
        width: 800px;
        height: 800px;
        left: -220px;
        top: -180px;
        background: radial-gradient(circle at 30% 30%, #f0f2f7 0%, #dfe3ec 78%, transparent 100%);
      }

      .bg-shape.two {
        width: 860px;
        height: 860px;
        right: -260px;
        bottom: -280px;
        background: radial-gradient(circle at 60% 40%, #f7f1f4 0%, #e8e9f0 80%, transparent 100%);
      }

      .card {
        width: min(92vw, 350px);
        padding: 24px 28px;
        background: var(--card-bg);
        border: 1px solid var(--line);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
        position: relative;
        z-index: 1;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 22px;
        font-weight: 500;
        margin-bottom: 12px;
      }

      .ms-logo {
        width: 16px;
        height: 16px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: 1fr 1fr;
        gap: 2px;
      }

      .ms-logo span:nth-child(1) {
        background: #f25022;
      }

      .ms-logo span:nth-child(2) {
        background: #7fba00;
      }

      .ms-logo span:nth-child(3) {
        background: #00a4ef;
      }

      .ms-logo span:nth-child(4) {
        background: #ffb900;
      }

      .heading {
        font-size: 29px;
        line-height: 1.3;
        margin: 8px 0 2px;
        font-weight: 600;
      }

      .subheading {
        margin: 0;
        font-size: 12px;
        color: var(--muted);
      }

      .accounts {
        list-style: none;
        margin: 16px 0 0;
        padding: 0;
      }

      .account-link {
        width: 100%;
        border: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        text-align: left;
        background: #ffffff;
        padding: 10px 8px;
        border-radius: 4px;
        cursor: pointer;
        transition: background 140ms ease;
      }

      .account-link:hover {
        background: #f5f5f5;
      }

      .account-main {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }

      .avatar {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        border: 1px solid #c9c9c9;
        background: #efefef;
        color: #646464;
        display: grid;
        place-items: center;
        font-size: 17px;
        flex: 0 0 32px;
      }

      .account-text {
        min-width: 0;
      }

      .account-name {
        margin: 0;
        font-size: 13px;
        color: #262626;
      }

      .account-email {
        margin: 0;
        font-size: 11px;
        color: #606060;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .kebab {
        color: #606060;
        font-size: 18px;
        line-height: 1;
      }

      @media (max-width: 560px) {
        .card {
          padding: 18px;
        }

        .heading {
          font-size: 26px;
        }
      }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <div class="bg-shape one" aria-hidden="true"></div>
      <div class="bg-shape two" aria-hidden="true"></div>

      <main class="card" role="main" aria-label="Account picker">
        <div class="brand">
          <div class="ms-logo" aria-hidden="true">
            <span></span><span></span><span></span><span></span>
          </div>
          <span>Microsoft</span>
        </div>

        <h1 class="heading">Pick an account</h1>
        <p class="subheading">to continue with your microsoft account</p>

        <ul class="accounts">
          <li>
            <a class="account-link" href="chatbot.html" aria-label="Sign in as test@testing-demo.com">
              <div class="account-main">
                <div class="avatar" aria-hidden="true">U</div>
                <div class="account-text">
                  <p class="account-name">Test User</p>
                  <p class="account-email">test@testing-demo.com</p>
                </div>
              </div>
              <div class="kebab" aria-hidden="true">⋮</div>
            </a>
          </li>
        </ul>
      </main>
    </div>
  </body>
</html>
