<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
    <title>Neon Terrarium</title>
    <style>
      :root {
        --bg-1: #01040c;
        --bg-2: #07162a;
        --bg-3: #0b2238;
        --sun-core: #fff9d4;
        --sun-mid: #ffc76a;
        --sun-edge: #ef7c26;
        --orbit-flatten: 0.32;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        min-height: 100vh;
        overflow: hidden;
        position: relative;
        perspective: 130vmin;
        transform-style: preserve-3d;
        background:
          radial-gradient(circle at 52% 52%, rgba(255, 171, 81, 0.16), transparent 26%),
          radial-gradient(circle at 20% 24%, rgba(102, 184, 255, 0.08), transparent 32%),
          radial-gradient(circle at 86% 76%, rgba(130, 120, 255, 0.07), transparent 34%),
          linear-gradient(180deg, var(--bg-1) 0%, var(--bg-2) 54%, var(--bg-3) 100%);
      }

      body::before,
      body::after {
        content: "";
        position: absolute;
        inset: -8%;
        pointer-events: none;
      }

      body::before {
        background-image:
          radial-gradient(2px 2px at 7% 15%, rgba(255, 255, 255, 0.8), transparent 60%),
          radial-gradient(1px 1px at 12% 64%, rgba(255, 255, 255, 0.72), transparent 60%),
          radial-gradient(2px 2px at 21% 30%, rgba(255, 255, 255, 0.7), transparent 60%),
          radial-gradient(1px 1px at 29% 80%, rgba(255, 255, 255, 0.86), transparent 60%),
          radial-gradient(2px 2px at 36% 12%, rgba(255, 255, 255, 0.78), transparent 60%),
          radial-gradient(1px 1px at 43% 71%, rgba(255, 255, 255, 0.74), transparent 60%),
          radial-gradient(2px 2px at 51% 24%, rgba(255, 255, 255, 0.74), transparent 60%),
          radial-gradient(1px 1px at 62% 87%, rgba(255, 255, 255, 0.85), transparent 60%),
          radial-gradient(2px 2px at 69% 37%, rgba(255, 255, 255, 0.7), transparent 60%),
          radial-gradient(1px 1px at 75% 58%, rgba(255, 255, 255, 0.94), transparent 60%),
          radial-gradient(2px 2px at 82% 14%, rgba(255, 255, 255, 0.82), transparent 60%),
          radial-gradient(1px 1px at 89% 42%, rgba(255, 255, 255, 0.78), transparent 60%),
          radial-gradient(2px 2px at 94% 73%, rgba(255, 255, 255, 0.8), transparent 60%);
        opacity: 0.84;
      }

      body::after {
        background:
          radial-gradient(circle at 30% 18%, rgba(119, 178, 255, 0.09), transparent 34%),
          radial-gradient(circle at 72% 68%, rgba(255, 136, 94, 0.1), transparent 30%),
          radial-gradient(circle at 85% 24%, rgba(128, 255, 240, 0.06), transparent 26%);
        filter: blur(34px);
      }

      .scene,
      .planet,
      .moon,
      .planet-system,
      .moon-system,
      .planet-orbit {
        position: absolute;
        left: 50%;
        top: 50%;
        transform-origin: center center;
        transform-style: preserve-3d;
        will-change: transform;
      }

      .scene {
        position: fixed;
        inset: 0;
      }

      .sun {
        position: absolute;
        left: 50%;
        top: 50%;
        width: clamp(88px, 11.8vmin, 148px);
        aspect-ratio: 1;
        border-radius: 50%;
        transform: translate(-50%, -50%) translateZ(8vmin);
        background:
          radial-gradient(circle at 30% 28%, var(--sun-core) 8%, var(--sun-mid) 40%, var(--sun-edge) 76%, #c95715 100%);
        box-shadow:
          0 0 30px rgba(255, 186, 95, 0.58),
          0 0 88px rgba(255, 144, 60, 0.44),
          0 0 184px rgba(255, 120, 46, 0.26);
        animation: sun-pulse 8s ease-in-out infinite;
        z-index: 10;
      }

      .sun::before,
      .sun::after,
      .planet::before,
      .planet::after,
      .moon::before {
        content: "";
        position: absolute;
        border-radius: inherit;
        pointer-events: none;
      }

      .sun::before {
        inset: 9%;
        background:
          repeating-conic-gradient(
            from 18deg,
            rgba(255, 255, 255, 0.1) 0deg,
            rgba(255, 255, 255, 0) 18deg,
            rgba(255, 223, 167, 0.22) 36deg,
            rgba(255, 255, 255, 0) 56deg
          );
        mix-blend-mode: screen;
        opacity: 0.66;
        animation: swirl 11s linear infinite;
      }

      .sun::after {
        inset: -33%;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255, 211, 131, 0.3), transparent 72%);
        filter: blur(16px);
      }

      .planet-system {
        width: 2px;
        height: 2px;
      }

      .planet-orbit {
        width: calc(var(--orbit-radius) * 2);
        height: calc(var(--orbit-radius) * 2);
        transform: translate(-50%, -50%) scaleY(var(--orbit-flatten));
        border-radius: 50%;
        border: 1px solid rgba(186, 214, 255, 0.14);
        box-shadow: 0 0 18px rgba(148, 177, 232, 0.05);
        pointer-events: none;
      }

      .planet {
        width: var(--size);
        height: var(--size);
        border-radius: 50%;
        overflow: hidden;
        transform:
          translate(-50%, -50%)
          translate3d(var(--planet-x, 0), var(--planet-y, 0), var(--depth));
        background: var(--color);
        box-shadow:
          0 0 13px var(--glow, rgba(255, 255, 255, 0.2)),
          inset -0.38vmin -0.45vmin 0.9vmin rgba(0, 0, 0, 0.45),
          inset 0.25vmin 0.3vmin 0.75vmin rgba(255, 255, 255, 0.2);
      }

      .planet.earth {
        transform:
          translate(-50%, -50%)
          translate3d(var(--planet-x, 0), var(--planet-y, 0), var(--depth))
          scaleY(0.68);
      }

      .planet::before {
        inset: 0;
        background:
          radial-gradient(circle at 32% 24%, rgba(255, 255, 255, 0.35), transparent 33%),
          linear-gradient(112deg, rgba(0, 0, 0, 0) 38%, rgba(0, 0, 0, 0.42) 100%);
        mix-blend-mode: screen;
      }

      .planet::after {
        inset: -4%;
        border-radius: 50%;
        border: 1px solid rgba(255, 255, 255, 0.2);
        opacity: 0.35;
      }

      .planet.jupiter::after,
      .planet.saturn::after,
      .planet.uranus::after,
      .planet.neptune::after {
        inset: 6% 0;
        border-radius: 50%;
        background: repeating-linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.16) 0%,
          rgba(255, 255, 255, 0) 13%,
          rgba(0, 0, 0, 0.14) 24%
        );
        border: none;
        opacity: 0.42;
      }

      .planet.saturn > .ring {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 196%;
        height: 46%;
        transform: translate(-50%, -50%) rotateX(73deg) rotateZ(18deg);
        border-radius: 50%;
        border: 2px solid rgba(222, 198, 156, 0.68);
        box-shadow:
          0 0 14px rgba(210, 184, 144, 0.28),
          inset 0 0 12px rgba(255, 239, 203, 0.2);
      }

      .planet.saturn > .ring::before {
        content: "";
        position: absolute;
        inset: 16%;
        border-radius: 50%;
        border: 1px solid rgba(255, 232, 183, 0.45);
      }

      .moon-system {
        width: 2px;
        height: 2px;
        animation: orbit-planet var(--moon-duration) linear infinite;
        animation-delay: var(--moon-delay, 0s);
      }

      .moon-orbit {
        position: absolute;
        left: 50%;
        top: 50%;
        width: calc(var(--moon-radius) * 2);
        height: calc(var(--moon-radius) * 2);
        transform: translate(-50%, -50%) rotateX(70deg);
        border-radius: 50%;
        border: 1px solid rgba(193, 217, 248, 0.13);
      }

      .moon {
        width: var(--moon-size);
        height: var(--moon-size);
        border-radius: 50%;
        transform: translate(-50%, -50%) translateX(var(--moon-radius));
        background: radial-gradient(circle at 30% 28%, #f8f8f8, #d8d8d8 57%, #969696 100%);
        box-shadow:
          inset -0.16vmin -0.13vmin 0.3vmin rgba(0, 0, 0, 0.35),
          0 0 6px rgba(220, 230, 248, 0.3);
        opacity: 0.95;
      }

      .moon::before {
        inset: 20% 58% 53% 22%;
        border-radius: 50%;
        background: rgba(120, 120, 120, 0.28);
        filter: blur(0.06vmin);
      }

      @keyframes sun-pulse {
        0%,
        100% {
          transform: translate(-50%, -50%) translateZ(8vmin) scale(1);
        }
        50% {
          transform: translate(-50%, -50%) translateZ(8vmin) scale(1.04);
        }
      }

      @keyframes swirl {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes orbit-planet {
        from {
          transform: translate(-50%, -50%) rotateX(70deg) rotateZ(0deg);
        }
        to {
          transform: translate(-50%, -50%) rotateX(70deg) rotateZ(360deg);
        }
      }

      @media (max-width: 860px) {
        body {
          perspective: 180vmin;
        }

        .sun {
          width: clamp(72px, 15vmin, 108px);
        }

        .planet-orbit,
        .moon-orbit {
          border-color: rgba(198, 221, 255, 0.12);
        }
      }
    </style>
  </head>
  <body>
    <div class="scene" id="scene">
      <div class="sun"></div>
    </div>

    <script>
      const planets = [
        {
          name: "mercury",
          radius: "8vmin",
          size: "1.1vmin",
          duration: "9s",
          color: "radial-gradient(circle at 32% 28%, #f0ead9, #b8afa2 62%, #867f74 100%)",
          glow: "rgba(200, 185, 166, 0.3)",
          moonCount: 0,
          visibleMoons: 0
        },
        {
          name: "venus",
          radius: "11.5vmin",
          size: "1.45vmin",
          duration: "14s",
          color: "radial-gradient(circle at 32% 28%, #ffe7ba, #d3ac6f 64%, #9a7643 100%)",
          glow: "rgba(230, 179, 102, 0.28)",
          moonCount: 0,
          visibleMoons: 0
        },
        {
          name: "earth",
          radius: "15vmin",
          size: "1.6vmin",
          duration: "19s",
          color: "radial-gradient(circle at 30% 26%, #d8f2ff, #4f90d2 58%, #235b9e 100%)",
          glow: "rgba(87, 160, 232, 0.3)",
          moonCount: 1,
          visibleMoons: 1
        },
        {
          name: "mars",
          radius: "19vmin",
          size: "1.3vmin",
          duration: "24s",
          color: "radial-gradient(circle at 30% 24%, #ffd9c7, #d97d53 62%, #9d4c2e 100%)",
          glow: "rgba(210, 113, 76, 0.25)",
          moonCount: 2,
          visibleMoons: 2
        },
        {
          name: "jupiter",
          radius: "25vmin",
          size: "3.8vmin",
          duration: "36s",
          color: "radial-gradient(circle at 30% 28%, #ffe9ce, #c89e72 52%, #9a734f 100%)",
          glow: "rgba(227, 184, 131, 0.24)",
          moonCount: 95,
          visibleMoons: 3
        },
        {
          name: "saturn",
          radius: "31vmin",
          size: "3.2vmin",
          duration: "47s",
          color: "radial-gradient(circle at 30% 28%, #fff0cf, #d4be8f 58%, #9c8359 100%)",
          glow: "rgba(222, 197, 148, 0.22)",
          moonCount: 274,
          visibleMoons: 3
        },
        {
          name: "uranus",
          radius: "37vmin",
          size: "2.4vmin",
          duration: "58s",
          color: "radial-gradient(circle at 30% 28%, #ebffff, #8cd8d6 58%, #4aa5ab 100%)",
          glow: "rgba(138, 219, 218, 0.24)",
          moonCount: 28,
          visibleMoons: 2
        },
        {
          name: "neptune",
          radius: "43vmin",
          size: "2.35vmin",
          duration: "72s",
          color: "radial-gradient(circle at 30% 28%, #d7e5ff, #4d78c8 58%, #27438a 100%)",
          glow: "rgba(90, 125, 214, 0.25)",
          moonCount: 16,
          visibleMoons: 2
        }
      ];

      const scene = document.getElementById("scene");
      const ORBIT_FLATTEN = 0.32;
      const planetMotions = [];

      const clampMoonSize = (i) => {
        if (i === 0) return "0.58vmin";
        if (i === 1) return "0.46vmin";
        return "0.36vmin";
      };

      planets.forEach((planet, planetIndex) => {
        const orbit = document.createElement("div");
        orbit.className = "planet-orbit";
        orbit.style.setProperty("--orbit-radius", planet.radius);
        scene.appendChild(orbit);

        const system = document.createElement("div");
        system.className = "planet-system";

        const planetEl = document.createElement("div");
        planetEl.className = `planet ${planet.name}`;
        planetEl.style.setProperty("--size", planet.size);
        planetEl.style.setProperty("--color", planet.color);
        planetEl.style.setProperty("--glow", planet.glow);
        planetEl.style.setProperty("--depth", `${(planetIndex - 3) * 0.75}vmin`);
        system.appendChild(planetEl);

        planetMotions.push({
          el: planetEl,
          radius: Number.parseFloat(planet.radius),
          duration: Number.parseFloat(planet.duration),
          phase: (-planetIndex * 1.7 * Math.PI * 2) / Number.parseFloat(planet.duration)
        });

        if (planet.name === "saturn") {
          const ring = document.createElement("div");
          ring.className = "ring";
          planetEl.appendChild(ring);
        }

        const visibleMoons = Math.min(planet.moonCount, planet.visibleMoons ?? 2);
        const moonOrbitMax = visibleMoons;
        for (let i = 0; i < moonOrbitMax; i += 1) {
          const moonRing = document.createElement("div");
          moonRing.className = "moon-orbit";
          moonRing.style.setProperty("--moon-radius", `${1.25 + i * 0.5}vmin`);
          planetEl.appendChild(moonRing);
        }

        for (let i = 0; i < visibleMoons; i += 1) {
          const moonSystem = document.createElement("div");
          moonSystem.className = "moon-system";

          const trackSlot = i % 3;
          const moonRadius = 1.25 + trackSlot * 0.5;
          const moonDuration = 2.7 + trackSlot * 0.75 + i * 0.2;

          moonSystem.style.setProperty("--moon-radius", `${moonRadius}vmin`);
          moonSystem.style.setProperty("--moon-duration", `${moonDuration}s`);
          moonSystem.style.setProperty("--moon-delay", `${-(i * 0.35)}s`);
          moonSystem.style.transform = `translate(-50%, -50%) rotate(${(i * 62) % 360}deg)`;

          const moon = document.createElement("div");
          moon.className = "moon";
          moon.style.setProperty("--moon-size", clampMoonSize(i));

          moonSystem.appendChild(moon);
          planetEl.appendChild(moonSystem);
        }

        scene.appendChild(system);
      });

      const animatePlanets = (timestamp) => {
        const time = timestamp / 1000;

        planetMotions.forEach((motion) => {
          const angle = (time / motion.duration) * Math.PI * 2 + motion.phase;
          const x = Math.cos(angle) * motion.radius;
          const y = Math.sin(angle) * motion.radius * ORBIT_FLATTEN;

          motion.el.style.setProperty("--planet-x", `${x}vmin`);
          motion.el.style.setProperty("--planet-y", `${y}vmin`);
        });

        requestAnimationFrame(animatePlanets);
      };

      requestAnimationFrame(animatePlanets);
    </script>
  </body>
</html>
