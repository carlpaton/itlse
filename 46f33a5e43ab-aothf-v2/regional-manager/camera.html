<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
  <title>AoTech - Camera</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Sora:wght@600;700&display=swap");

    :root {
      --font-display: "Sora", "Segoe UI", sans-serif;
      --font-body: "Public Sans", "Segoe UI", sans-serif;
      --color-page-bg: #f3f5f8;
      --color-surface: #ffffff;
      --color-border: #d7e0ea;
      --color-text-strong: #10233a;
      --color-text-body: #26394f;
      --color-focus: #5b8cc2;
      --radius-sm: 6px;
      --radius-md: 10px;
      --shadow-soft: 0 1px 2px rgba(10, 24, 40, 0.08), 0 6px 16px rgba(17, 36, 56, 0.04);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--color-page-bg);
      color: var(--color-text-body);
      font-family: var(--font-body);
    }

    .note-card {
      width: min(560px, 100%);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      background: var(--color-surface);
      box-shadow: var(--shadow-soft);
      padding: 24px;
    }

    h1 {
      margin: 0 0 12px;
      font-family: var(--font-display);
      color: var(--color-text-strong);
      font-size: clamp(1.5rem, 2.8vw, 1.9rem);
    }

    p {
      margin: 0;
      font-size: 1rem;
      line-height: 1.55;
    }

    .back-link {
      display: inline-block;
      margin-top: 16px;
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--color-border);
      color: var(--color-text-body);
      text-decoration: none;
      font-weight: 600;
    }

    .back-link:focus-visible {
      outline: 2px solid var(--color-focus);
      outline-offset: 2px;
    }
  </style>
</head>
<body>
  <main class="note-card" aria-label="QR camera information">
    <h1>Camera</h1>
    <p>qr search opens the camera and reads the qr details then finds jobs for that asset</p>
    <a class="back-link" href="dashboard.html">Back to Dashboard</a>
  </main>
</body>
</html>
