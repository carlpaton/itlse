<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
  <title>AoTech - Fault Logged</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Sora:wght@600;700&display=swap");

    :root {
      --font-display: "Sora", "Segoe UI", sans-serif;
      --font-body: "Public Sans", "Segoe UI", sans-serif;

      --color-page-bg: #f3f5f8;
      --color-surface: #ffffff;
      --color-border: #d7e0ea;

      --color-text-strong: #10233a;
      --color-text-body: #26394f;
      --color-text-muted: #5f7185;
      --color-focus: #5b8cc2;
      --shadow-soft: 0 1px 2px rgba(10, 24, 40, 0.08), 0 6px 16px rgba(17, 36, 56, 0.04);

      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 20px;
      --space-6: 24px;
      --space-8: 32px;
      --radius-sm: 6px;
      --radius-md: 10px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      font-family: var(--font-body);
      background: radial-gradient(1200px 500px at -10% -20%, #e7edf5 0%, transparent 60%),
        radial-gradient(800px 400px at 110% 120%, #e9eef6 0%, transparent 60%),
        var(--color-page-bg);
      color: var(--color-text-body);
    }

    .page-shell {
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: var(--space-6);
    }

    .screen {
      width: min(760px, 100%);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      background: var(--color-surface);
      box-shadow: var(--shadow-soft);
      padding: clamp(var(--space-6), 5vw, 56px);
      text-align: center;
    }

    .screen-title {
      margin: 0;
      font-family: var(--font-display);
      color: var(--color-text-strong);
      font-size: clamp(1.8rem, 4vw, 2.35rem);
      letter-spacing: -0.02em;
    }

    .status-chip {
      margin: var(--space-5) auto 0;
      width: fit-content;
      min-height: 34px;
      padding: 0 var(--space-4);
      border: 1px solid #bcc9d8;
      border-radius: var(--radius-sm);
      display: grid;
      place-items: center;
      font-family: var(--font-body);
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--color-text-muted);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      background: #f8fafd;
    }

    .message {
      margin: var(--space-6) 0 0;
      font-size: clamp(1.1rem, 2.2vw, 1.35rem);
      color: var(--color-text-body);
      font-family: var(--font-body);
      font-weight: 600;
      line-height: 1.4;
    }

    .message-sub {
      margin: var(--space-2) 0 0;
      color: var(--color-text-muted);
      font-size: 0.95rem;
    }

    .actions {
      margin-top: clamp(var(--space-6), 6vw, 56px);
      display: flex;
      justify-content: center;
    }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      min-width: 132px;
      border-radius: var(--radius-sm);
      border: 1px solid transparent;
      background: linear-gradient(135deg, #324e6b, #3a5a7b);
      color: #ffffff;
      font-size: 0.95rem;
      font-weight: 700;
      font-family: var(--font-body);
      cursor: pointer;
      box-shadow: 0 6px 12px rgba(42, 63, 86, 0.18);
      transition: transform 140ms ease, box-shadow 140ms ease, filter 140ms ease;
    }

    .btn-primary:hover {
      filter: brightness(0.95);
      transform: translateY(-1px);
      box-shadow: 0 10px 16px rgba(42, 63, 86, 0.2);
    }

    .btn-primary:focus-visible {
      outline: 2px solid var(--color-focus);
      outline-offset: 2px;
    }

    @media (max-width: 560px) {
      .screen {
        padding: var(--space-6);
      }

      .message {
        line-height: 1.2;
      }
    }
  </style>
</head>
<body>
  <div class="page-shell">
    <main class="screen" aria-labelledby="confirmation-status">
      <h1 class="screen-title" id="confirmation-status">Confirmation</h1>
      <div class="status-chip">Fault Logged</div>
      <p class="message">Fault has been logged. Thank you.</p>
      <p class="message-sub">Your report has been submitted for triage.</p>

      <div class="actions">
        <a class="btn-primary" href="./index.html">Close Window</a>
      </div>
    </main>
  </div>
</body>
</html>
